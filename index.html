<body>
<div class="clearfix m-auto my-1">
    <body>
    <div class="race-container">
        <div class="finish-line"></div>
        <div class="track">
            <div class="creatures">
                <div class="creature" id="creature1"></div>
                <div class="creature" id="creature2"></div>
                <div class="creature" id="creature3"></div>
                <div class="creature" id="creature4"></div>
                <div class="creature" id="creature5"></div>
            </div>
        </div>
        <div class="controls">
            <button id="startButton">Start mimic race</button>
            <button id="resetButton">Reset race</button>
        </div>
    </div>

    <div id="winnerDisplay" class="winner-display">
        <p id="winnerText"></p>
        <p id="winnerText2">vince!</p>
    </div>

</div>
